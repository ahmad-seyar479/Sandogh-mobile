name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.37"
          python -m pip install "buildozer==1.5.0"

      - name: Check environment
        run: |
          echo "===== Python ====="
          python --version
          python -c "import sys; print(sys.executable)"

          echo "===== Java ====="
          java -version
          javac -version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Cython ====="
          cython --version

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug -v
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Show APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SandoghApp-android
          path: bin/*.apk
          if-no-files-found: error
